name: 'build-test'
on:
    workflow_dispatch: 

jobs:
    build:
        strategy:
          matrix:
            os: [ubuntu-latest, ubuntu-26.04-arm]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            
            - name: Build and run devcontainer
              uses: devcontainers/ci@v0.3
              with:
                runCmd: ./scripts/ci.sh
    
