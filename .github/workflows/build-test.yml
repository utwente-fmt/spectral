name: 'build-test'
on:
    workflow_dispatch: 
    pull_request:
      branches:
        - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            
            - name: Build and run devcontainer
              uses: devcontainers/ci@v0.3
              with:
                runCmd: ./scripts/ci.sh
